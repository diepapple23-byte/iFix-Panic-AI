<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PanicAI Tool</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      background: #020617;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input, button, textarea {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 16px;
    }

    button {
      background: #020617;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1e293b;
    }

    .result {
      background: #f8fafc;
      border-left: 5px solid #0f172a;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .danger {
      color: #dc2626;
      font-weight: bold;
    }

    .warning {
      color: #d97706;
      font-weight: bold;
    }

    .good {
      color: #16a34a;
      font-weight: bold;
    }

    .tag {
      display: inline-block;
      background: #e2e8f0;
      padding: 6px 12px;
      border-radius: 999px;
      margin: 4px;
      font-size: 14px;
    }

    pre {
      white-space: pre-wrap;
      background: #020617;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 15px;
      max-height: 300px;
      overflow: auto;
    }
  </style>
</head>

<body>
  <header>
    <h1>PanicAI Tool</h1>
    <p>Công cụ phân tích panic-full iPhone</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>Đăng ký sử dụng</h2>
      <input id="shopName" placeholder="Tên cửa hàng / kỹ thuật viên" />
      <input id="phone" placeholder="Số điện thoại" />
      <input id="email" placeholder="Email" />
      <button onclick="register()">Đăng ký và bắt đầu</button>
      <p id="registerStatus"></p>
    </div>

    <div class="card" id="toolBox" style="display:none;">
      <h2>Upload file panic-full</h2>
      <input type="file" id="fileInput" accept=".ips,.txt,.log,.json" />
      <button onclick="analyzeFile()">Phân tích log</button>

      <div id="result"></div>
    </div>

    <div class="card" id="previewBox" style="display:none;">
      <h2>Preview log</h2>
      <pre id="logPreview"></pre>
    </div>
  </div>

  <script>
    function register() {
      const shopName = document.getElementById("shopName").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;

      if (!shopName || !phone || !email) {
        alert("Vui lòng nhập đủ thông tin đăng ký");
        return;
      }

      localStorage.setItem("panicai_user", JSON.stringify({
        shopName,
        phone,
        email
      }));

      document.getElementById("registerStatus").innerHTML =
        "<span class='good'>Đăng ký thành công!</span>";

      document.getElementById("toolBox").style.display = "block";
    }

    async function analyzeFile() {
      const file = document.getElementById("fileInput").files[0];

      if (!file) {
        alert("Vui lòng chọn file panic-full");
        return;
      }

      const text = await file.text();
      const lower = text.toLowerCase();

      document.getElementById("previewBox").style.display = "block";
      document.getElementById("logPreview").innerText = text.slice(0, 8000);

      let results = [];

      if (lower.includes("thermalmonitord") || lower.includes("missing sensor")) {
        results.push({
          title: "Nghi lỗi cảm biến nhiệt",
          level: "Cao",
          confidence: "85%",
          parts: ["Cụm sạc", "Pin", "Cảm biến nhiệt", "Mainboard"],
          advice: "Kiểm tra cụm sạc, pin, socket và cảm biến nhiệt."
        });
      }

      if (lower.includes("baseband") || lower.includes("modem")) {
        results.push({
          title: "Nghi lỗi baseband / sóng",
          level: "Cao",
          confidence: "88%",
          parts: ["Baseband", "IC nguồn BB", "Mainboard", "Anten"],
          advice: "Kiểm tra IMEI, sóng, modem firmware và khu vực baseband."
        });
      }

      if (lower.includes("nand") || lower.includes("storage") || lower.includes("nvme")) {
        results.push({
          title: "Nghi lỗi NAND / bộ nhớ",
          level: "Cao",
          confidence: "80%",
          parts: ["NAND", "Đường dữ liệu", "Mainboard"],
          advice: "Kiểm tra lỗi restore, treo táo, reboot lặp."
        });
      }

      if (lower.includes("watchdog") || lower.includes("timeout")) {
        results.push({
          title: "Nghi lỗi watchdog timeout",
          level: "Trung bình",
          confidence: "65%",
          parts: ["iOS", "Cụm linh kiện phụ", "Mainboard"],
          advice: "Có thể thử restore trước, sau đó kiểm tra phần cứng."
        });
      }

      if (lower.includes("i2c")) {
        results.push({
          title: "Nghi lỗi đường I2C",
          level: "Cao",
          confidence: "78%",
          parts: ["Camera", "Face ID", "Cụm sạc", "Mainboard"],
          advice: "Kiểm tra các linh kiện giao tiếp I2C và socket liên quan."
        });
      }

      if (lower.includes("charging") || lower.includes("usb") || lower.includes("dock")) {
        results.push({
          title: "Nghi lỗi sạc / USB",
          level: "Trung bình",
          confidence: "72%",
          parts: ["Cụm sạc", "IC sạc", "Cáp sạc", "Mainboard"],
          advice: "Kiểm tra chân sạc, cụm sạc, IC sạc và dấu hiệu vào nước."
        });
      }

      if (results.length === 0) {
        results.push({
          title: "Chưa nhận diện được lỗi",
          level: "Thấp",
          confidence: "30%",
          parts: ["Cần phân tích thủ công"],
          advice: "Cần đọc panicString chi tiết hoặc bổ sung database keyword."
        });
      }

      showResult(results, text);
    }

    function showResult(results, text) {
      let html = "<div class='result'>";
      html += "<h2>Kết quả chẩn đoán</h2>";

      results.forEach(item => {
        html += `
          <h3>${item.title}</h3>
          <p><b>Mức độ:</b> ${item.level}</p>
          <p><b>Độ tin cậy:</b> ${item.confidence}</p>
          <p><b>Linh kiện nghi ngờ:</b></p>
          <p>${item.parts.map(p => `<span class="tag">${p}</span>`).join("")}</p>
          <p><b>Hướng kiểm tra:</b> ${item.advice}</p>
          <hr>
        `;
      });

      html += "<button onclick='exportReport()'>Xuất báo cáo</button>";
      html += "</div>";

      document.getElementById("result").innerHTML = html;

      localStorage.setItem("panicai_last_result", JSON.stringify(results));
    }

    function exportReport() {
      const user = JSON.parse(localStorage.getItem("panicai_user") || "{}");
      const results = JSON.parse(localStorage.getItem("panicai_last_result") || "[]");

      let report = `
PANICAI REPORT

Cửa hàng / Kỹ thuật viên: ${user.shopName || ""}
Số điện thoại: ${user.phone || ""}
Email: ${user.email || ""}

KẾT QUẢ CHẨN ĐOÁN:
`;

      results.forEach((item, index) => {
        report += `

${index + 1}. ${item.title}
Mức độ: ${item.level}
Độ tin cậy: ${item.confidence}
Linh kiện nghi ngờ: ${item.parts.join(", ")}
Hướng kiểm tra: ${item.advice}
`;
      });

      const blob = new Blob([report], { type: "text/plain" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "panicai-report.txt";
      a.click();

      URL.revokeObjectURL(url);
    }

    window.onload = function () {
      const user = localStorage.getItem("panicai_user");
      if (user) {
        document.getElementById("toolBox").style.display = "block";
        document.getElementById("registerStatus").innerHTML =
          "<span class='good'>Đã đăng ký, có thể sử dụng tool.</span>";
      }
    };
  </script>
</body>
</html>
